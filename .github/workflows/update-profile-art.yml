name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"     # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install needed: fetch_contributions.py and
      # render_heatmap_svg.py are pure standard library. Add
      #   - run: pip install -r scripts/requirements.txt
      # here if you ever pull heavy deps into the daily job.
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
